<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter cloned Page</title>
    <link rel="icon" href="https://img.freepik.com/free-vector/new-2023-twitter-logo-x-icon-design_1017-45418.jpg?semt=ais_hybrid&w=740&q=80"/>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
</head>

<body class="bg-black text-white d-flex gap-4">

    <!--Side Navbar-->
    <aside class="sidebar d-flex flex-column">
        <a href="#" class="nav-link">
            <span><i class="bi bi-twitter-x"></i></span>
        <a href="#" class="nav-link">
            <span><i class="bi bi-house-door-fill active"></i></span> <span class="description active">Home</span>
        </a>
        <a href="#" class="nav-link">
            <span><i class="bi bi-search"></i></span> <span class="description">Explore</span>
        </a>
        <a href="#" class="nav-link">
            <span><i class="bi bi-bell"></i></span> <span class="description">Notifications</span>
        </a>
        <a href="#" class="nav-link">
            <span><i class="bi bi-person-plus"></i></span> <span class="description">Follows</span>
        </a>
        <a href="#" class="nav-link">
            <span><i class="bi bi-envelope"></i></span> <span class="description">Chat</span>
        </a>
        <a href="#" class="nav-link">
            <span><img src="./assets/grok.svg" alt="grok" height="20px" width="20px"/></span> <span class="description">Grok</span>
        </a>
        <a href="#" class="nav-link">
            <span><i class="bi bi-person"></i></span> <span class="description">Profile</span>
        </a>
        <a href="#" class="nav-link">
            <span><i class="bi bi-three-dots more"></i></span> <span class="description">More</span>
        </a>
        <button type="button" class="btn btn-light rounded-pill fw-bolder post-btn">Post</button>
        <button type="button" class="btn btn-black rounded-pill d-flex justify-content-center align-items-center gap-2 p-2 profile-btn">
            <img src="./assets/iam.png" alt="profile" height="50px" width="50px"/>
            <span class="d-flex flex-wrap details">
                <p class="description title text-white">eric_</p>
                <p class="description subtitle">@EricMothupi21</p>
            </span> 
            <i class="bi bi-three-dots description more-details p-2"></i>
        </button>
    </aside>

    <!--Feed Section-->
    <main class="main-content">
        
        <section class="container text-center feed border-end border-6 border-secondary p-0 m-0">
            <div class="row d-flex justify-content-end border-bottom border-secondary p-0 m-0">
                <div class="col-6 p-2 m-0 feed-btn">
                    <span class="border-bottom border-primary border-4 p-2">For you</span>
                </div>
                <div class="col-6 p-2 feed-btn m-0">
                    <span class="p-4">Following</span>
                </div>
            </div>

            <div class="row border-bottom border-secondary m-0">
                <div class="col">
                    <form class="d-flex flex-column">
                         <div class="d-flex flex-row justify-content-start align-items-center p-2 mt-2">
                            <img class="rounded-pill" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTfnz0YCfxEjvhGSnJQwgOwSbFIzHndPRjwHw&s" alt="profile" height="50px" width="50px"/>
                            <input class="" type="text" placeholder="What's Happening?"/>
                         </div>
                         <div class="icons d-flex justify-content-between align-items-center">
                            <div class="icon-container d-flex gap-2">
                                <a href="#"><i class="bi bi-image"></i></a>
                                <a href="#">2</a>
                                <a href="#">3</a>
                                <a href="#">4</a>
                                <a href="#"><i class="bi bi-emoji-smile"></i></a>
                                <a href="#">6</a>
                                <a href="#">7</a>
                                <a href="#">8</a>
                            </div>
                            <button class="btn btn-secondary text-grey">Post</button>
                         </div>
                    </form>
                </div>
            </div>

            <div class="row border-bottom border-secondary m-0 d-flex align-items-center justify-content-center">
                <div class="col">
                    <p class="text-blue text-center p-2">Show 100 posts</p>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <div class="post-content">
                        <div class="content-details d-flex p-2">
                            <img class="rounded-pill" src="https://pbs.twimg.com/profile_images/1932142323565002753/zvgr-UiI_400x400.jpg" height="50px" width="50px"/>
                            <div class="user-details d-flex flex-column gap-0">
                                <p>Mind Over Weakness <span class="user">@mindoverweakness</span></p>
                                <p>Dark texts that girls always reply to</p>
                            </div>
                            <i class="bi bi-three-dots description more-details p-2"></i>
                        </div>
                        <div class="main-content">

                        </div>
                        <div class="content-footer">
                            
                        </div>

                    </div>
                </div>
            </div>
        </section>
        
        

        <!--Side Section-->
        <aside class="subscription">
            <h1>SubScription</h1>

        </aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
